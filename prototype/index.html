<!doctype html>
<!-- PROTOTYPE — throwaway, never ship.
     Plan: multi-stack layout of the stackytab new-tab interaction — a horizontal row of stacks,
     one expanded pane per stack; stacks added via + gutters between/at the sides, per-stack +
     for panes, stacks droppable (x) and draggable to reorder. Within-stack rendering switches
     via ?variant=A|B|C from the floating bar (or arrow keys). Run: npm run prototype -> http://localhost:8123 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stackytab — interaction prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" data-variant="A"></main>

  <div id="chooser" hidden>
    <button class="chooser-option" data-type="markdown">
      <span class="type-glyph markdown">M</span><span>Markdown</span>
    </button>
    <button class="chooser-option" data-type="excalidraw">
      <span class="type-glyph excalidraw">&#9670;</span><span>Excalidraw</span>
    </button>
  </div>

  <div id="state-panel">
    <div class="state-head">
      <span class="state-title">state</span>
      <span class="state-actions">
        <button id="demo-btn">demo stack</button>
        <button id="clear-btn">clear stack</button>
      </span>
    </div>
    <pre id="state-json"></pre>
  </div>

  <div id="prototype-bar">
    <button id="prev-variant" title="previous variant">&#9664;</button>
    <span id="variant-label"></span>
    <button id="next-variant" title="next variant">&#9654;</button>
    <button id="state-toggle" title="toggle state readout">state</button>
  </div>

  <script src="stack.js"></script>
</body>
</html>
